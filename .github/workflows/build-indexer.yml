name: Build nukkitindexer

on:
  push:
    branches: [master]
    paths:
      - 'indexer/src/**'
      - 'indexer/data/**'
      - 'indexer/Cargo.toml'
      - '.github/workflows/build-indexer.yml'
  workflow_dispatch:

concurrency:
  group: build-nukkitindexer
  cancel-in-progress: true

jobs:
  build:
    name: Build nukkitindexer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-musl

      # ring / tree-sitter contain C code, which musl-gcc compiles for the musl target
      - name: Setup musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            indexer/target/
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('indexer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-musl-

      - name: Build nukkitindexer
        run: cargo build --release --target x86_64-unknown-linux-musl --manifest-path indexer/Cargo.toml

      # rustc emits "static-pie linked" for the musl target since 1.71
      - name: Verify static linking
        run: |
          BIN=indexer/target/x86_64-unknown-linux-musl/release/nukkitindexer
          file "$BIN"
          file -b "$BIN" | grep -qE 'statically linked|static-pie linked'

      - name: Smoke test
        run: indexer/target/x86_64-unknown-linux-musl/release/nukkitindexer --help

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nukkitindexer-latest
          name: nukkitindexer Binary
          files: indexer/target/x86_64-unknown-linux-musl/release/nukkitindexer
          body: Auto-built nukkitindexer binary (statically linked against musl, runs on any x86_64 Linux)
          prerelease: true
          make_latest: false
